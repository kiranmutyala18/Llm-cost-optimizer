version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: llm_optimizer_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmopt
      POSTGRES_PASSWORD: llmopt
      POSTGRES_DB: llm_optimizer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmopt -d llm_optimizer"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llm_optimizer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: llm_optimizer_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://llmopt:llmopt@postgres:5432/llm_optimizer
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

volumes:
  pgdata:
